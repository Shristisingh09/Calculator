<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculator</h1>
    </header>
    <section class="hero" id="container">
        <div class="box" id="box">
            <div class="calc" id="write"><h2>0</h2></div>
            <div class="num" id="clr">clr</div>
            <div class="num" id="del">DEL</div>
            <div class="num" id="percent">%</div>
            <div class="num" id="divide">/</div>
            <div class="num" id="seven">7</div>
            <div class="num" id="eight">8</div>
            <div class="num" id="nine">9</div>
            <div class="num" id="multiply">*</div>
            <div class="num" id="four">4</div>
            <div class="num" id="five">5</div>
            <div class="num" id="six">6</div>
            <div class="num" id="subs">-</div>
            <div class="num" id="one">1</div>
            <div class="num" id="two">2</div>
            <div class="num" id="three">3</div>
            <div class="num" id="add">+</div>
            <div class="num" id="dot">.</div>
            <div class="num" id="zero">0</div>
            <div class="num_1" id="equal">=</div>
        </div>

    </section>



    <script src="app.js"></script>
</body>
</html>
